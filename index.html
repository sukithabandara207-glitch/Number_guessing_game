<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUm_gessing</title>
    <link rel="styleSheet" href="Assests/style.css">
</head>
<body>
    
<div class="game-card">
        <h1>Number Guessing Game 🎯</h1>
        <b><p class="subtitle">Enter your guessing number 1 to 10</p></b>
        
        <div class="chances-box">
            Chances Left: <span id="chances">5</span>
        </div>

        <div class="chances-box">
            Attempts: <span id="attempts">0</span>
        </div>

        <div class="input-container">
            <input 
                type="number" 
                id="guessInput" 
                min="1" 
                max="10" 
                placeholder="1-10" 
            >
            
            <button id="guessBtn" onclick="btnCheckGuessOnAction()">Submit</button>
        </div>

        <button id="restartBtn" class="restart-btn" onclick="btnRestartGameOnAction()" style="display: none;">Play Again 🔄</button>
    </div>

  <script src="script.js"></script>



<!--import extenshion-->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
</body>
</html>
